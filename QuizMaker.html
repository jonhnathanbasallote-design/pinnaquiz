<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pinnaquiz - Quiz Maker</title>
  <style>
    :root { 
      --bg-color: #121212; 
      --card-bg: #1a1919; 
      --text-color: #ffffff; 
      --input-bg: #262626; 
      --border-color: #333333; 
    }
    body.light-mode { 
      --bg-color: #f4f6f9; 
      --card-bg: #ffffff; 
      --text-color: #1a1919; 
      --input-bg: #eef1f5; 
      --border-color: #e2e8f0; 
    }
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-color); 
      transition: background 0.3s, color 0.3s;
    }
    header { 
      background: var(--card-bg); 
      padding: 15px 30px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 2px solid #2e7d32; 
    }
    .back-btn {
      background-color: transparent; 
      border: 1px solid #ff5252; 
      color: #ff5252; 
      padding: 6px 14px;
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 13px; 
      font-weight: bold; 
      text-decoration: none;
      transition: all 0.25s ease-in-out;
    }
    .back-btn:hover { 
      background-color: #ff5252; 
      color: #ffffff; 
      box-shadow: 0 0 12px rgba(255, 82, 82, 0.6); 
      transform: translateY(-1px); 
    }
    .container { 
      max-width: 800px; 
      margin: 30px auto; 
      background: var(--card-bg); 
      padding: 25px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    input, select, button { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      background: var(--input-bg); 
      color: var(--text-color); 
      border: 1px solid var(--border-color); 
      border-radius: 5px; 
      box-sizing: border-box; 
    }

    /* Dynamic Theme-Aware Question Box */
    .q-box { 
      background: var(--input-bg); 
      color: var(--text-color);
      padding: 15px; 
      margin-top: 15px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      transition: background 0.3s, border-color 0.3s;
      position: relative;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .q-header strong {
      font-size: 1rem;
      color: #2e7d32;
    }

    .btn-remove-q {
      width: auto;
      background: transparent;
      border: 1px solid #d32f2f;
      color: #d32f2f;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin: 0;
      transition: all 0.2s;
    }

    .btn-remove-q:hover {
      background: #d32f2f;
      color: #ffffff;
    }
    
    .btn-green { 
      background: #2e7d32; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
      margin-top: 20px; 
    }
    .btn-green:hover {
      background: #1b5e20;
    }
  </style>
</head>
<body>

  <header>
    <h1 style="color:#2e7d32; margin:0;">PinnaQuiz Creator Studio</h1>
    <a href="TeacherDashboard.html" class="back-btn">← Back to Dashboard</a>
  </header>

  <div class="container">
    <h2>Create Assessment</h2>
    <form id="createQuizForm">
      <label>Quiz Title</label>
      <input type="text" id="quizTitle" placeholder="e.g. Midterm Exam" required>

      <label>Assign Scope</label>
      <select id="targetScope">
        <optgroup label="Entire Sections">
          <option value="SECTION:2CPE-A">2CPE-A (All Students)</option>
          <option value="SECTION:2CPE-B">2CPE-B (All Students)</option>
        </optgroup>
        <optgroup label="Specific Individual Student (2CPE-A)">
          <option value="STUDENT:2500310">2500310 - Nathan</option>
          <option value="STUDENT:2500311">2500311 - Benj</option>
          <option value="STUDENT:2500312">2500312 - Jose</option>
        </optgroup>
        <optgroup label="Specific Individual Student (2CPE-B)">
          <option value="STUDENT:2500313">2500313 - Meckayla</option>
          <option value="STUDENT:2500314">2500314 - Luiji</option>
          <option value="STUDENT:2500315">2500315 - Lance</option>
        </optgroup>
      </select>

      <label>Global Cutoff Time (HH:MM)</label>
      <input type="time" id="cutoffTime" required>

      <h3>Questions Studio</h3>
      <div id="questionsContainer"></div>

      <button type="button" id="addQuestionBtn" style="background:var(--input-bg); color:var(--text-color); border: 1px dashed #2e7d32; margin-top:15px; cursor:pointer;">+ Add Question</button>
      <button type="submit" class="btn-green">Publish Assessment</button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    function addQuestionField() {
      const container = document.getElementById('questionsContainer');
      const qDiv = document.createElement('div');
      qDiv.className = 'q-box';
      
      qDiv.innerHTML = `
        <div class="q-header">
          <strong class="q-number-title">Question</strong>
          <button type="button" class="btn-remove-q" onclick="removeQuestionField(this)">Remove</button>
        </div>
        <label>Type</label>
        <select class="q-type" onchange="renderTypeOptions(this, this.value)">
          <option value="mc">Multiple Choice (1 pt)</option>
          <option value="tf">True or False (1 pt)</option>
          <option value="id">Identification (1 pt)</option>
          <option value="essay">Essay (Custom Max Points)</option>
        </select>

        <label>Prompt</label>
        <input type="text" class="q-prompt" required>

        <div class="type-body"></div>
      `;
      container.appendChild(qDiv);
      renderTypeOptions(qDiv.querySelector('.q-type'), 'mc');
      reindexQuestions();
    }

    function removeQuestionField(btn) {
      const qDiv = btn.closest('.q-box');
      if (qDiv) {
        qDiv.remove();
        reindexQuestions();
      }
    }

    function reindexQuestions() {
      const allQuestions = document.querySelectorAll('#questionsContainer .q-box');
      allQuestions.forEach((qDiv, idx) => {
        const titleHeader = qDiv.querySelector('.q-number-title');
        if (titleHeader) {
          titleHeader.innerText = `Question ${idx + 1}`;
        }
      });
    }

    function renderTypeOptions(selectElem, type) {
      const qBox = selectElem.closest('.q-box');
      const body = qBox.querySelector('.type-body');

      if (type === 'mc') {
        body.innerHTML = `
          <input type="text" class="opt-0" placeholder="Option A" required>
          <input type="text" class="opt-1" placeholder="Option B" required>
          <input type="text" class="opt-2" placeholder="Option C" required>
          <input type="text" class="opt-3" placeholder="Option D" required>
          <label>Correct Choice</label>
          <select class="q-correct">
            <option value="0">Option A</option>
            <option value="1">Option B</option>
            <option value="2">Option C</option>
            <option value="3">Option D</option>
          </select>
        `;
      } else if (type === 'tf') {
        body.innerHTML = `
          <label>Correct Choice</label>
          <select class="q-correct">
            <option value="True">True</option>
            <option value="False">False</option>
          </select>
        `;
      } else if (type === 'id') {
        body.innerHTML = `
          <label>Expected Answer (Case-Insensitive)</label>
          <input type="text" class="q-correct-text" required>
        `;
      } else if (type === 'essay') {
        body.innerHTML = `
          <label>Max Points for this Essay</label>
          <input type="number" class="q-max-points" min="1" max="100" value="10" required>
        `;
      }
    }

    document.getElementById('addQuestionBtn').addEventListener('click', addQuestionField);
    addQuestionField();

    document.getElementById('createQuizForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const qBoxes = document.querySelectorAll('.q-box');
      if (qBoxes.length === 0) {
        alert("Please add at least one question to publish.");
        return;
      }

      const questions = [];

      qBoxes.forEach(box => {
        const type = box.querySelector('.q-type').value;
        const prompt = box.querySelector('.q-prompt').value.trim();
        let qData = { type, prompt, maxPoints: 1 };

        if (type === 'mc') {
          qData.options = [
            box.querySelector('.opt-0').value.trim(),
            box.querySelector('.opt-1').value.trim(),
            box.querySelector('.opt-2').value.trim(),
            box.querySelector('.opt-3').value.trim()
          ];
          qData.correct = parseInt(box.querySelector('.q-correct').value, 10);
        } else if (type === 'tf') {
          qData.correct = box.querySelector('.q-correct').value;
        } else if (type === 'id') {
          qData.correct = box.querySelector('.q-correct-text').value.trim().toLowerCase();
        } else if (type === 'essay') {
          qData.maxPoints = parseInt(box.querySelector('.q-max-points').value, 10) || 10;
        }

        questions.push(qData);
      });

      const scopeVal = document.getElementById('targetScope').value;
      const [targetType, targetValue] = scopeVal.split(':');

      const newQuiz = {
        id: 'quiz_' + Date.now(),
        title: document.getElementById('quizTitle').value.trim(),
        targetType, targetValue,
        cutoffTimeStr: document.getElementById('cutoffTime').value,
        questions
      };

      const res = await fetch('/api/quizzes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newQuiz)
      });

      if (res.ok) {
        alert("Assessment published successfully!");
        window.location.href = "TeacherDashboard.html";
      }
    });
  </script>
</body>
</html>
