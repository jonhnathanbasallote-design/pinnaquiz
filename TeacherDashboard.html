<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pinnaquiz - Faculty Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>
    :root { --bg-color: #121212; --card-bg: #1a1919; --text-color: #ffffff; --border-color: #333; }
    body.light-mode { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-color: #1a1919; --border-color: #ccc; }
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; }
    header { background-color: var(--card-bg); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e7d32; }
    .brand h1 { font-size: 2rem; color: #2e7d32; margin: 0; }
    
    .user-profile { display: flex; align-items: center; gap: 15px; }
    .user-info { text-align: right; }
    .user-name { font-weight: bold; margin: 0; color: var(--text-color); font-size: 14px; }
    .user-id { font-size: 12px; color: #888888; margin: 0; }

    .logout-btn {
      background-color: transparent; border: 1px solid #ff5252; color: #ff5252; padding: 6px 14px;
      border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; text-decoration: none;
      transition: all 0.25s ease-in-out;
    }
    .logout-btn:hover { background-color: #ff5252; color: #ffffff; box-shadow: 0 0 12px rgba(255, 82, 82, 0.6); transform: translateY(-1px); }
    
    .dashboard-container { display: flex; flex: 1; }
    aside { width: 200px; background-color: var(--card-bg); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .nav-link { color: #cccccc; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; }
    .nav-link.active, .nav-link:hover { background-color: #2e7d32; color: #ffffff; }
    main { flex: 1; padding: 30px; overflow-y: auto; }
    .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .create-btn { background-color: #2e7d32; color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold; text-decoration: none; }
    .data-table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
    .data-table th, .data-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .data-table th { background-color: rgba(0,0,0,0.2); color: #2e7d32; }
    .score-pill { background-color: rgba(46, 125, 50, 0.2); color: #4caf50; border: 1px solid #2e7d32; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
    .btn-actions { display: flex; gap: 8px; align-items: center; }
    .btn-review { background: #2e7d32; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; }
    .badge-completed { color: #888888; font-size: 13px; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><h1>PinnaQuiz</h1></div>
    <div class="user-profile">
      <div class="user-info">
        <p class="user-name">Ms. Lianne</p>
        <p class="user-id">ID: prof-admin (Faculty)</p>
      </div>
      <a href="Login.html" class="logout-btn">Logout</a>
    </div>
  </header>

  <div class="dashboard-container">
    <aside>
      <a href="TeacherDashboard.html" class="nav-link active">Overview & Scores</a>
      <a href="QuizMaker.html" class="nav-link">+ Create Quiz</a>
    </aside>

    <main>
      <div class="top-action-bar">
        <h2 style="margin:0;">Faculty Overview</h2>
        <a href="QuizMaker.html" class="create-btn">+ Create New Quiz</a>
      </div>

      <h3 style="color:#2e7d32;">Student Submissions & Manual Review</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Student ID</th>
            <th>Quiz Title</th>
            <th>Score</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scoresTableBody"></tbody>
      </table>
    </main>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    const studentDirectory = {
      "2500310": "Nathan",
      "2500311": "Benj",
      "2500312": "Jose",
      "2500313": "Meckayla",
      "2500314": "Luiji",
      "2500315": "Lance"
    };

    async function loadStudentScores() {
      try {
        const resSub = await fetch('/api/submissions');
        const submissions = await resSub.json();

        const tbody = document.getElementById('scoresTableBody');
        tbody.innerHTML = '';

        if (submissions.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="color:#888; text-align:center;">No student submissions recorded yet.</td></tr>';
          return;
        }

        submissions.forEach(sub => {
          const studentName = studentDirectory[sub.studentId] || 'Unknown Student';
          const isFlagged = (sub.status || '').includes('Flagged') || (sub.status || '').includes('Terminated');
          
          // Check if submission is already fully checked or published
          const isGradedOrChecked = sub.teacherChecked || sub.status === 'Graded' || isFlagged;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${studentName}</strong></td>
            <td>${sub.studentId}</td>
            <td>${sub.quizTitle || 'Assessment'}</td>
            <td><span class="score-pill" style="${isFlagged ? 'border-color:#ff5252; color:#ff5252; background:rgba(255,82,82,0.15);' : ''}">${sub.score} / ${sub.total}</span></td>
            <td><span style="color:${isFlagged ? '#ff5252' : (sub.status === 'Pending Review' ? '#ff9800' : '#4caf50')}">${sub.status || 'Graded'}</span></td>
            <td>
              <div class="btn-actions">
                ${isGradedOrChecked ? '<span class="badge-completed">Published</span>' : `<a href="QuizReview.html?subId=${sub.id}" class="btn-review">Inspect & Grade</a>`}
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Failed to load scores.", err);
      }
    }

    loadStudentScores();
  </script>
</body>
</html>
